<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD App</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Optional Custom CSS -->
  <link rel="stylesheet" href="/crud.css">
  
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
<div class="container my-5">
  <h1 class="text-center mb-4">Single Page CRUD App</h1>

  <!-- Form -->
  <div class="card mb-4">
    <div class="card-body">
      <form id="postForm">
        <input type="hidden" id="postId">
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" required>
        </div>
        <div class="mb-3">
          <label for="body" class="form-label">Body</label>
          <textarea class="form-control" id="body" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="saveBtn">Add Post</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div id="loading" class="text-center mb-3" style="display:none;">
    <div class="spinner-border text-primary" role="status"></div>
    <span>Loading...</span>
  </div>

  <!-- Posts Table -->
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Body</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="postsTable">
      <!-- Optional: dynamically render posts if passed from server -->
      <% if (posts && posts.length) { %>
        <% posts.forEach(post => { %>
          <tr>
            <td><%= post.id %></td>
            <td><%= post.title %></td>
            <td><%= post.body %></td>
            <td>
              <button class="btn btn-sm btn-info editBtn" data-id="<%= post.id %>">Edit</button>
              <button class="btn btn-sm btn-danger deleteBtn" data-id="<%= post.id %>">Delete</button>
            </td>
          </tr>
        <% }) %>
      <% } %>
    </tbody>
  </table>
</div>

<script src="/crud.js"></script>
</body>
</html>
